<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teleprompter</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --dim: #9aa0a6;
    --line: rgba(0,0,0,.18);
    --size: 44px;
  }
  html.dark {
    --bg: #000000;
    --fg: #ffffff;
    --dim: #6b7075;
    --line: rgba(255,255,255,.22);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 400 16px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    overflow: hidden;
  }

  /* Reading zone sits in the top quarter so your eyes stay near the lens. */
  #zone {
    position: fixed;
    top: 22%;
    left: 0;
    right: 0;
    border-top: 2px solid var(--line);
    pointer-events: none;
    z-index: 3;
  }
  #zone::after {
    content: "";
    position: absolute;
    top: -9px;
    left: 12px;
    border: 8px solid transparent;
    border-left-color: var(--line);
  }

  #scroller {
    height: 100%;
    overflow: hidden;
    position: relative;
  }
  #script {
    padding: 22vh 6vw 90vh;
    font-size: var(--size);
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: -0.01em;
    white-space: pre-wrap;
    outline: none;
    caret-color: var(--dim);
  }
  #script:empty::before {
    content: "Paste your script here, then press Space.";
    color: var(--dim);
  }

  #bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    gap: 18px;
    align-items: center;
    padding: 10px 16px;
    background: var(--bg);
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--dim);
    z-index: 4;
    transition: opacity .25s;
  }
  body.running #bar { opacity: 0; }
  body.running #bar:hover { opacity: 1; }
  #bar b { color: var(--fg); font-variant-numeric: tabular-nums; }
  kbd {
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .spacer { flex: 1; }
  button {
    font: inherit;
    color: var(--dim);
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button:hover { color: var(--fg); }
</style>
</head>
<body>

<div id="scroller"><div id="script" contenteditable spellcheck="false"></div></div>
<div id="zone"></div>

<div id="bar">
  <span><kbd>Space</kbd> play</span>
  <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> speed <b id="spd">4.0</b></span>
  <span><kbd>&minus;</kbd><kbd>+</kbd> text <b id="sz">44</b>px</span>
  <span><kbd>R</kbd> restart</span>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="sync">Sync</button>
  <button id="theme">Invert</button>
</div>

<script>
const scroller = document.getElementById('scroller');
const script   = document.getElementById('script');
const spdEl    = document.getElementById('spd');
const szEl     = document.getElementById('sz');
const statusEl = document.getElementById('status');

const RAW = 'https://gist.githubusercontent.com/Har150n/bbbff0b5695f1b5b27cecbf57e47466d/raw/script.txt';

let speed   = +(localStorage.tp_speed || 4);
let size    = +(localStorage.tp_size  || 44);
let running = false;
let offset  = 0;
let last    = 0;

script.innerText = localStorage.tp_text || '';
apply();
pull();

function setStatus(t) { statusEl.textContent = t; }

async function pull() {
  setStatus('syncing\u2026');
  try {
    const r = await fetch(RAW + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const text = (await r.text()).replace(/\s+$/, '');
    script.innerText = text;
    localStorage.tp_text = text;
    restart();
    setStatus('synced ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}));
  } catch (e) {
    setStatus(localStorage.tp_text ? 'offline, using saved' : 'no script');
  }
}

function apply() {
  document.documentElement.style.setProperty('--size', size + 'px');
  spdEl.textContent = speed.toFixed(1);
  szEl.textContent  = size;
  localStorage.tp_speed = speed;
  localStorage.tp_size  = size;
}

function tick(now) {
  if (!running) return;
  if (!last) last = now;
  offset += speed * (now - last) / 16.67;
  last = now;

  const max = script.scrollHeight - scroller.clientHeight;
  if (offset >= max) { offset = max; stop(); }

  script.style.transform = 'translateY(' + -offset + 'px)';
  requestAnimationFrame(tick);
}

function start() {
  if (running) return;
  running = true;
  last = 0;
  document.body.classList.add('running');
  script.blur();
  requestAnimationFrame(tick);
}

function stop() {
  running = false;
  document.body.classList.remove('running');
}

function restart() {
  stop();
  offset = 0;
  script.style.transform = 'translateY(0px)';
}

document.addEventListener('keydown', e => {
  const typing = document.activeElement === script && !running;

  if (e.code === 'Space' && !typing) {
    e.preventDefault();
    running ? stop() : start();
    return;
  }
  if (e.key === 'ArrowUp')   { e.preventDefault(); speed = Math.min(30, speed + 0.5); apply(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); speed = Math.max(0.5, speed - 0.5); apply(); return; }

  if (typing) return;

  if (e.key === '+' || e.key === '=') { size = Math.min(140, size + 4); apply(); }
  if (e.key === '-' || e.key === '_') { size = Math.max(20,  size - 4); apply(); }
  if (e.key.toLowerCase() === 'r')    { restart(); }
});

script.addEventListener('input', () => {
  localStorage.tp_text = script.innerText;
  setStatus('local edits');
});

document.getElementById('sync').addEventListener('click', pull);

document.getElementById('theme').addEventListener('click', () => {
  document.documentElement.classList.toggle('dark');
  localStorage.tp_dark = document.documentElement.classList.contains('dark') ? '1' : '';
});
if (localStorage.tp_dark) document.documentElement.classList.add('dark');
</script>
</body>
</html>
